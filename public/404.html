<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leon Thiel</title>
    <script>
      // GitHub Pages SPA redirect: forward the requested path to index.html
      // so react-router can pick up routing client-side.
      var path = location.pathname || '/'
      sessionStorage.setItem('spa-redirect', path + location.search + location.hash)
      location.replace('/')
    </script>
  </head>
  <body></body>
</html>
